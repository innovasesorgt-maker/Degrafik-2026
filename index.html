<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gráficos Conectado a Hoja de Cálculo</title>
    <!-- Importar Chart.js desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container" style="text-align: center;">
    <!-- Logo centrado -->
    <img src="https://github.com/innovasesorgt-maker/Degrafik-2026/blob/main/LOGOTIPO%20(1).png?raw=true" alt="Degrafik" style="max-width: 200px; display: block; margin: 0 auto 15px auto;">
    
    <!-- Título centrado y en color azul corporativo -->
    <h1 style="color: #0056b3; font-size: 24px; margin-bottom: 20px;">Panel de Métricas en Tiempo Real</h1>
    
    <canvas id="graficoDinamico"></canvas>
</div>

  <script>
async function cargarDatosYGraficar() {
    try {
        const urlAPI = 'https://script.google.com/macros/s/AKfycbwSuWjfaLKmJWKjSY7MW9hrmg9ryjbbaj-m0q17YVv3Eb3A8fP5RMCmeV1Os2wEh_2i0A/exec';
        
        const respuesta = await fetch(urlAPI);
        const textoPlano = await respuesta.text();
        const datosRemotos = JSON.parse(textoPlano);

        const etiquetas = datosRemotos.map(item => item.etiqueta);
        const valores = datosRemotos.map(item => item.valor);

        const ctx = document.getElementById('graficoDinamico').getContext('2d');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: etiquetas,
                datasets: [{
                    label: 'Cantidad por Carpeta',
                    data: valores,
                    backgroundColor: 'rgba(0, 123, 255, 0.2)',
                    borderColor: 'rgba(0, 123, 255, 1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    } catch (error) {
        console.error("Detalle del error al graficar:", error);
    }
}

cargarDatosYGraficar();
</script>
