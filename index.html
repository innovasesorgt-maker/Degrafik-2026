<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gráficos Conectado a Hoja de Cálculo</title>
    <!-- Importar Chart.js desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Panel de Métricas en Tiempo Real</h2>
        <canvas id="graficoDinamico"></canvas>
    </div>

    <script>
        // Función para cargar los datos e inicializar el gráfico
      async function cargarDatosYGraficar() {
    try {
        // 1. Pega aquí la URL de tu Aplicación Web de Google Apps Script
        const urlAPI = 'https://script.google.com/macros/s/TU_URL_DE_APPS_SCRIPT/exec';
        
        const respuesta = await fetch(urlAPI);
        const datosRemotos = await respuesta.json();

        // 2. Extrae las etiquetas y los valores dependiendo de cómo estructuraste el JSON.
        // (Asumiendo que tu JSON es un arreglo de objetos con propiedades como 'etiqueta' y 'valor')
        const etiquetas = datosRemotos.map(item => item.etiqueta);
        const valores = datosRemotos.map(item => item.valor);

        const ctx = document.getElementById('graficoDinamico').getContext('2d');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: etiquetas, // Usamos los datos reales de Google Sheets
                datasets: [{
                    label: 'Datos desde la Nube (Google Sheets)',
                    data: valores, // Usamos los datos reales de Google Sheets
                    backgroundColor: 'rgba(0, 123, 255, 0.2)',
                    borderColor: 'rgba(0, 123, 255, 1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

    } catch (error) {
        console.error("Error al cargar los datos de Google Sheets:", error);
    }
}

// Ejecutar la función al cargar la página
cargarDatosYGraficar();
