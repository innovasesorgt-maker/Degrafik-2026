<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gráficos Conectado a Hoja de Cálculo</title>
    <!-- Importar Chart.js desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- AGREGAR ESTA LÍNEA DEL PLUGIN -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-datalabels@2"></script>
    
    <style>
  /* NUEVO: Aseguramos que la página ocupe toda la altura de la ventana */
  html, body {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f9f9f9;
  }

  .container {
      width: 90%;
      /* NUEVO: Definimos un alto fijo para el panel */
      height: 80vh; 
      max-width: 900px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      /* Importante para que Chart.js respete el alto */
      position: relative; 
  }
  /* ... resto de tu estilo ... */
</style>
</head>
<body>

    <div class="container" style="text-align: center;">
    <!-- Logo centrado -->
    <img src="https://github.com/innovasesorgt-maker/Degrafik-2026/blob/main/LOGOTIPO%20(1).png?raw=true" alt="Degrafik" style="max-width: 200px; display: block; margin: 0 auto 15px auto;">
    
    <!-- Título centrado y en color azul corporativo -->
    <h1 style="color: #0056b3; font-size: 24px; margin-bottom: 20px;">Panel de Métricas en Tiempo Real</h1>
    
    <canvas id="graficoDinamico"></canvas>
</div>

 <script>
async function cargarDatosYGraficar() {
    try {
        const urlAPI = 'https://script.google.com/macros/s/AKfycbwb6gMxyNuGYHcryWPSe030Wo_r210gqR1BEYvO8vFcVM0IhCEDVb6CeWJVkp26kPDvg/exec';
        
        const respuesta = await fetch(urlAPI);
        const textoPlano = await respuesta.text();
        const datosRemotos = JSON.parse(textoPlano);

        const etiquetas = datosRemotos.map(item => item.etiqueta);
        const valores = datosRemotos.map(item => item.valor);

        const coloresBarras = etiquetas.map(etiqueta => {
            if (etiqueta.includes('Instalación Pendiente')) return '#dc3545'; // Rojo
            if (etiqueta.includes('Producción')) return '#ffc107'; // Amarillo
            if (etiqueta.includes('Completado')) return '#28a745'; // Verde
            if (etiqueta.includes('Diseño')) return '#fd7e14'; // Naranja
            if (etiqueta.includes('Rollo')) return '#ffc107';
            if (etiqueta.includes('Corte Laser')) return '#ffeeba';
            return '#6c757d';
        });

        const ctx = document.getElementById('graficoDinamico').getContext('2d');

        if (window.miGrafica instanceof Chart) {
            window.miGrafica.destroy();
        }

        window.miGrafica = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: etiquetas,
                datasets: [{
                    label: 'Cantidad',
                    data: valores,
                    backgroundColor: coloresBarras,
                    borderWidth: 1,
                    borderRadius: 6,
                    barPercentage: 0.6
                }]
            },
            options: {
                responsive: true,
                // Permite que la gráfica se estire al tamaño del contenedor definido en CSS
                maintainAspectRatio: false, 
                layout: {
                    padding: { top: 30, bottom: 20 } // Espaciado para los números
                },
                plugins: {
                    legend: { display: false },
                    title: {
                        display: true,
                        text: 'Estado de Producción Degrafik',
                        font: { size: 18, family: 'Arial' },
                        color: '#0056b3'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        // --- NUEVO: Forzamos el eje Y para que no se corte ---
                        suggestedMax: Math.max(...valores) + 2, // Un poco más alto que el valor máximo
                        ticks: {
                            font: { size: 12 },
                            stepSize: 1 // Forzamos números enteros si son valores pequeños
                        },
                        grid: { color: 'rgba(0, 0, 0, 0.07)' }
                    },
                    x: {
                        // --- NUEVO: Aseguramos que el eje X muestre las etiquetas ---
                        display: true,
                        grid: { display: false },
                        ticks: {
                            font: { size: 12, weight: 'bold' },
                            color: '#333',
                            maxRotation: 45, // Rotamos un poco si son muy largas
                            minRotation: 0,
                            autoSkip: false // Mostramos todas las etiquetas
                        }
                    }
                }
            }
        });
    } catch (error) {
        console.error("Error:", error);
    }
}

cargarDatosYGraficar();
</script>
