<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Métricas - Degrafik</title>
    <!-- Importar Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 950px;
            height: 85vh;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        h1 {
            color: #0056b3;
            font-size: 24px;
            margin-top: 10px;
            margin-bottom: 25px;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Panel de Métricas en Tiempo Real</h1>
        
        <div class="chart-wrapper">
            <canvas id="graficoDinamico"></canvas>
        </div>
    </div>

    <script>
    async function cargarDatosYGraficar() {
        try {
            // URL directa blindada contra espacios fantasma
            const urlAPI = 'https://script.google.com/macros/s/AKfycbwSuWjfaLKmJWKjSY7MW9hrmg9ryjbbaj-m0q17YVv3Eb3A8fP5RMCmeV1Os2wEh_2i0A/exec';
            
            const respuesta = await fetch(urlAPI);
            const textoPlano = await respuesta.text();
            const datosRemotos = JSON.parse(textoPlano);

            const etiquetas = datosRemotos.map(item => item.etiqueta);
            const valores = datosRemotos.map(item => item.valor);

            const coloresBarras = etiquetas.map(etiqueta => {
                if (etiqueta.includes('Instalación Pendiente')) return '#dc3545';
                if (etiqueta.includes('Producción')) return '#ffc107';
                if (etiqueta.includes('Completado')) return '#28a745';
                if (etiqueta.includes('Diseño')) return '#fd7e14';
                if (etiqueta.includes('Rollo')) return '#ffc107'; 
                if (etiqueta.includes('Corte Laser')) return '#ffeeba'; 
                return '#6c757d';
            });

            const ctx = document.getElementById('graficoDinamico').getContext('2d');

            if (window.miGrafica instanceof Chart) {
                window.miGrafica.destroy();
            }

            window.miGrafica = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: etiquetas,
                    datasets: [{
                        label: 'Cantidad',
                        data: valores,
                        backgroundColor: coloresBarras,
                        borderWidth: 1,
                        borderRadius: 6,
                        barPercentage: 0.65
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { top: 15, bottom: 10 }
                    },
                    plugins: {
                        legend: { display: false },
                        title: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(0, 0, 0, 0.06)' },
                            ticks: { font: { size: 12 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: {
                                font: { size: 12, weight: 'bold' },
                                color: '#333',
                                callback: function(value) {
                                    const label = this.getLabelForValue(value);
                                    if (typeof label === 'string' && label.length > 15) {
                                        return label.split(' ');
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });
        } catch (error) {
            console.error("Detalle del error al cargar la gráfica:", error);
        }
    }

    cargarDatosYGraficar();
    </script>
</body>
</html>
