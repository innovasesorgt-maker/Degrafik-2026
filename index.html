<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gráficos Conectado a Hoja de Cálculo</title>
    <!-- Importar Chart.js desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Panel de Métricas en Tiempo Real</h2>
        <canvas id="graficoDinamico"></canvas>
    </div>

    <script>
async function cargarDatosYGraficar() {
    try {
        // Tu URL de Google Apps Script terminada en /exec
        const urlAPI = 'https://script.google.com/macros/s/AKfycbwb6gMxyNuGYHcryWPSe030Wo_r210gqR1BEYvO8vFcVM0IhCEDVb6CeWJVkp26kPDvg/exec';
        
        const respuesta = await fetch(urlAPI);
        const datosRemotos = await respuesta.json();

        console.log("Datos recibidos de Google Sheets:", datosRemotos);

        // Extraemos las propiedades que envía tu API
        const etiquetas = datosRemotos.map(item => item.etiqueta);
        const valores = datosRemotos.map(item => item.valor);

        const canvasElement = document.getElementById('graficoDinamico');
        if (!canvasElement) {
            console.error("No se encontró el elemento canvas con id 'graficoDinamico'");
            return;
        }

        const ctx = canvasElement.getContext('2d');

        new Chart(ctx, {
            type: 'line', // Puedes cambiar a 'bar' si prefieres barras
            data: {
                labels: etiquetas,
                datasets: [{
                    label: 'Cantidad por Área',
                    data: valores,
                    backgroundColor: 'rgba(0, 123, 255, 0.2)',
                    borderColor: 'rgba(0, 123, 255, 1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

    } catch (error) {
        console.error("Error al cargar o procesar los datos:", error);
    }
}

// Ejecutar al cargar la página
cargarDatosYGraficar();
</script>
