<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gráficos Conectado a Hoja de Cálculo</title>
    <!-- Importar Chart.js desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- AGREGAR ESTA LÍNEA DEL PLUGIN -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-datalabels@2"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container" style="text-align: center;">
    <!-- Logo centrado -->
    <img src="https://github.com/innovasesorgt-maker/Degrafik-2026/blob/main/LOGOTIPO%20(1).png?raw=true" alt="Degrafik" style="max-width: 200px; display: block; margin: 0 auto 15px auto;">
    
    <!-- Título centrado y en color azul corporativo -->
    <h1 style="color: #0056b3; font-size: 24px; margin-bottom: 20px;">Panel de Métricas en Tiempo Real</h1>
    
    <canvas id="graficoDinamico"></canvas>
</div>

  <script>
async function cargarDatosYGraficar() {
    try {
        const urlAPI = 'https://script.google.com/macros/s/AKfycbwb6gMxyNuGYHcryWPSe030Wo_r210gqR1BEYvO8vFcVM0IhCEDVb6CeWJVkp26kPDvg/exec';
        
        const respuesta = await fetch(urlAPI);
        const textoPlano = await respuesta.text();
        const datosRemotos = JSON.parse(textoPlano);

        const etiquetas = datosRemotos.map(item => item.etiqueta);
        const valores = datosRemotos.map(item => item.valor);

        // Colores personalizados estilo semáforo/estado
        const coloresBarras = etiquetas.map(etiqueta => {
            if (etiqueta.includes('Instalación Pendiente')) return '#dc3545'; // Rojo
            if (etiqueta.includes('Producción')) return '#ffc107'; // Amarillo
            if (etiqueta.includes('Completado')) return '#28a745'; // Verde
            if (etiqueta.includes('Diseño')) return '#fd7e14'; // Naranja
            if (etiqueta.includes('Rollo')) return '#ffc107'; // Amarillo claro
            if (etiqueta.includes('Corte Laser')) return '#ffeeba'; // Amarillo suave
            return '#6c757d';
        });

        const ctx = document.getElementById('graficoDinamico').getContext('2d');

        if (window.miGrafica instanceof Chart) {
            window.miGrafica.destroy();
        }

        window.miGrafica = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: etiquetas,
                datasets: [{
                    label: 'Cantidad',
                    data: valores,
                    backgroundColor: coloresBarras,
                    borderWidth: 1,
                    borderRadius: 6,
                    barPercentage: 0.65
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: { top: 20, bottom: 10 }
                },
                plugins: {
                    legend: { display: false },
                    title: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(0, 0, 0, 0.05)' },
                        ticks: { font: { size: 12 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: {
                            font: { size: 12, weight: 'bold' },
                            color: '#333',
                            callback: function(value) {
                                const label = this.getLabelForValue(value);
                                if (typeof label === 'string' && label.length > 16) {
                                    return label.split(' ');
                                }
                                return label;
                            }
                        }
                    }
                }
            }
        });
    } catch (error) {
        console.error("Detalle del error al graficar:", error);
    }
}

cargarDatosYGraficar();
</script>
