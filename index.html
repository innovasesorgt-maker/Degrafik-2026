<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gráficos Conectado a Hoja de Cálculo</title>
    <!-- Importar Chart.js desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- AGREGAR ESTA LÍNEA DEL PLUGIN -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-datalabels@2"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container" style="text-align: center;">
    <!-- Logo centrado -->
    <img src="https://github.com/innovasesorgt-maker/Degrafik-2026/blob/main/LOGOTIPO%20(1).png?raw=true" alt="Degrafik" style="max-width: 200px; display: block; margin: 0 auto 15px auto;">
    
    <!-- Título centrado y en color azul corporativo -->
    <h1 style="color: #0056b3; font-size: 24px; margin-bottom: 20px;">Panel de Métricas en Tiempo Real</h1>
    
    <canvas id="graficoDinamico"></canvas>
</div>

  <script>
async function cargarDatosYGraficar() {
    try {
        // --- CONFIGURACIÓN ---
        // Tu URL de Google Apps Script terminada en /exec
        const urlAPI = 'https://script.google.com/macros/s/AKfycbwSuWjfaLKmJWKjSY7MW9hrmg9ryjbbaj-m0q17YVv3Eb3A8fP5RMCmeV1Os2wEh_2i0A/exec'; 
        
        // --- PETICIÓN DE DATOS ---
        const respuesta = await fetch(urlAPI);
        const textoPlano = await respuesta.text();
        const datosRemotos = JSON.parse(textoPlano);

        // Extraemos las propiedades que envía tu API
        const etiquetas = datosRemotos.map(item => item.etiqueta);
        const valores = datosRemotos.map(item => item.valor);

        // --- CONFIGURACIÓN DE COLORES (Estilo Semáforo) ---
        const coloresBarras = etiquetas.map(etiqueta => {
            if (etiqueta.includes('Instalación Pendiente')) return 'rgba(230, 0, 0, 0.9)'; // Rojo intenso
            if (etiqueta.includes('Producción')) return 'rgba(255, 204, 0, 0.9)'; // Amarillo vibrante
            if (etiqueta.includes('Completado')) return 'rgba(0, 153, 51, 0.9)'; // Verde esmeralda
            if (etiqueta.includes('Diseño')) return 'rgba(255, 153, 0, 0.9)'; // Naranja cálido
            if (etiqueta.includes('Rollo')) return 'rgba(255, 204, 102, 0.9)'; // Amarillo suave
            if (etiqueta.includes('Corte Laser')) return 'rgba(255, 229, 153, 0.9)'; // Amarillo muy suave
            return 'rgba(100, 100, 100, 0.7)'; // Color gris por defecto
        });

        const ctx = document.getElementById('graficoDinamico').getContext('2d');

        // --- DESTRUCCIÓN DE GRÁFICA ANTERIOR (para evitar errores al refrescar) ---
        if (window.miGrafica instanceof Chart) {
            window.miGrafica.destroy();
        }

        // --- CREACIÓN DE LA NUEVA GRÁFICA ---
        window.miGrafica = new Chart(ctx, {
            type: 'bar', // TIPO: Gráfico de barras
            data: {
                labels: etiquetas,
                datasets: [{
                    label: 'Cantidad',
                    data: valores,
                    backgroundColor: coloresBarras, // Aplicamos los colores personalizados
                    borderColor: coloresBarras.map(color => color.replace('0.9', '1')), // Bordes un poco más oscuros
                    borderWidth: 1,
                    borderRadius: 4, // Bordes redondeados elegantes
                    barPercentage: 0.7 // Ancho de las barras
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false, // Permite que el gráfico se ajuste al contenedor
                layout: {
                    padding: {
                        top: 20,
                        bottom: 30 // Espacio extra abajo para las etiquetas largas
                    }
                },
                plugins: {
                    legend: {
                        display: false // Ocultamos la leyenda para un look más limpio
                    },
                    // --- ETIQUETAS DE DATOS (Valores numéricos) ---
                    datalabels: {
                        anchor: 'center', // Alineado al centro de la barra
                        align: 'center',
                        color: function(context) {
                            // El color del número cambia para asegurar contraste
                            return context.dataset.data[context.dataIndex] > 8 ? 'white' : 'black';
                        },
                        font: {
                            weight: 'bold',
                            size: 14
                        },
                        formatter: Math.round // Asegura que sean números enteros
                    },
                    // --- CONFIGURACIÓN DEL TÍTULO ---
                    title: {
                        display: true,
                        text: 'Panel de Métricas: Estado Actual', // Título principal
                        font: {
                            size: 20,
                            family: 'Arial, sans-serif',
                            weight: 'bold'
                        },
                        color: '#0056b3' // Color azul corporativo
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0, 0, 0, 0.08)' // Líneas de cuadrícula muy sutiles
                        },
                        ticks: {
                            font: { size: 12 }
                        }
                    },
                    x: {
                        grid: {
                            display: false // Sin cuadrícula vertical
                        },
                        // --- CONFIGURACIÓN DE ETIQUETAS DEL EJE X (Legibilidad) ---
                        ticks: {
                            font: { 
                                size: 13,
                                weight: 'bold' 
                            },
                            color: '#333',
                            // Ajuste para textos largos: saltos de línea automáticos
                            callback: function(value, index, values) {
                                const label = this.getLabelForValue(value);
                                if (typeof label === 'string' && label.length > 15) {
                                    // Divide la etiqueta si es muy larga
                                    return label.split(' '); 
                                }
                                return label;
                            },
                            // Alineación y ángulo para evitar solapamiento
                            maxRotation: 0, // No rotar si no es necesario, pero permite múltiples líneas
                            minRotation: 0,
                            autoSkip: false // Muestra todas las etiquetas
                        }
                    }
                }
            },
            // Importante: Incluir el plugin datalabels si no está cargado globalmente en el HTML
            plugins: [ChartDataLabels]
        });
    } catch (error) {
        console.error("Detalle del error al graficar:", error);
    }
}

cargarDatosYGraficar();
</script>
